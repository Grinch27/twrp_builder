# Requirements: download the fixed official ROM with bounded cross-run continuation.
# Ambiguity: a paused checkpoint is not a completed ROM or a published Release.
# Research: aria2 SIGINT, sparse tar, one-day Artifacts and workflow_dispatch.
# Optimization: 16 connections, five-second progress and sparse checkpoint storage.
# Risks: job limits, partial uploads, disk copies and automatic continuation loops.
# Validation: synthetic extraction/relay tests and successful five-minute Actions relay acceptance.
name: Selene Stock ROM Images

# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock_rom.yml']
  pull_request:
    paths: ['.github/workflows/stock_rom.yml']
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Previous stock run containing the checkpoint (blank for a new chain)
        type: string
        default: ''
      resume_artifact_id:
        description: Exact checkpoint Artifact ID from that run
        type: string
        default: ''
      relay_chain:
        description: Original run ID for the resumed chain
        type: string
        default: ''

run-name: Selene stock ROM - ${{ github.event_name }} - chain ${{ inputs.relay_chain || github.run_id }}
permissions:
  contents: read
concurrency:
  group: stock-rom-${{ inputs.relay_chain || github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  ROM_URL: https://bigota.d.miui.com/V14.0.4.0.TKUCNXM/selene_images_V14.0.4.0.TKUCNXM_20231228.0000.00_13.0_cn_cfe62df805.tgz
  ROM_VERSION: V14.0.4.0.TKUCNXM
  GH_PROMPT_DISABLED: '1'
  # Five-minute relay acceptance passed; reserve 30 minutes before the six-hour limit.
  RELAY_SECONDS: '19800'
  MAX_RELAY_ROUNDS: '12'

jobs:
  runner-image:
    name: Validate and resolve runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main
      - name: Checkout extractor
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Test extraction and relay boundaries with synthetic inputs
        env:
          TMPDIR: ${{ runner.temp }}
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_stock_rom*.py' -v

  download:
    name: Download or checkpoint official ROM (5h30m)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    permissions:
      contents: read
      actions: read
    env:
      RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
      RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id || '' }}
      RELAY_CHAIN: ${{ inputs.relay_chain || '' }}
    outputs:
      state: ${{ steps.download.outputs.state }}
      chain: ${{ steps.download.outputs.chain }}
      round: ${{ steps.download.outputs.round }}
      can_continue: ${{ steps.download.outputs.can_continue }}
      artifact_id: ${{ steps.checkpoint.outputs.artifact-id }}
    steps:
      - name: Start job clock and prepare isolated directory
        run: |
          set -euo pipefail
          umask 077
          printf 'RELAY_JOB_STARTED=%s\n' "$(date +%s)" >> "${GITHUB_ENV}"
          ROM_WORK="$(mktemp -d "${RUNNER_TEMP}/selene-stock.XXXXXXXX")"
          printf 'ROM_WORK=%s\nTMPDIR=%s\n' "${ROM_WORK}" "${ROM_WORK}" >> "${GITHUB_ENV}"
      - name: Checkout extractor
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Validate checkpoint provenance and download space
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v gh
          /usr/bin/python3 scripts/stock_rom_relay.py prepare
      - name: Install job-scoped run_sudo
        uses: Grinch27/github-actions/.github/actions/run-sudo@main
      - name: Install aria2 binary package when needed
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          if ! command -v aria2c >/dev/null 2>&1; then
            run_sudo apt-get update
            run_sudo apt-get -y --no-install-recommends install aria2
          fi
      - name: Verify real aria2 interruption and resume with a tiny loopback fixture
        if: env.RESUME_RUN_ID == ''
        run: |
          PYTHONPATH=tests /usr/bin/python3 -m unittest \
            test_stock_rom_relay.RelayTests.test_real_aria2_range_resume_across_checkpoint -v
      - name: Download the exact previous checkpoint
        if: env.RESUME_RUN_ID != ''
        uses: actions/download-artifact@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RESUME_RUN_ID }}
          artifact-ids: ${{ env.RESUME_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ env.ROM_WORK }}/incoming
      - name: Resume with aria2 and package stopped or complete data
        id: download
        run: /usr/bin/python3 scripts/stock_rom_relay.py download
      - name: Upload checkpoint or completed archive for one day
        id: checkpoint
        uses: actions/upload-artifact@main
        with:
          name: stock-rom-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.download.outputs.checkpoint_path }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Record checkpoint availability
        env:
          ARTIFACT_URL: ${{ steps.checkpoint.outputs.artifact-url }}
        run: |
          printf '[One-day ROM checkpoint](%s)\n' "${ARTIFACT_URL}" >> "${GITHUB_STEP_SUMMARY}"

  continue-download:
    name: Start the next round after checkpoint upload succeeds
    if: needs.download.outputs.state == 'paused'
    needs: [runner-image, download]
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_ID: ${{ needs.download.outputs.artifact_id }}
      RELAY_CHAIN: ${{ needs.download.outputs.chain }}
      RELAY_ROUND: ${{ needs.download.outputs.round }}
      CAN_CONTINUE: ${{ needs.download.outputs.can_continue }}
    steps:
      - name: Dispatch the same main workflow with exact checkpoint IDs
        run: |
          set -euo pipefail
          if [[ "${CAN_CONTINUE}" != true ]]; then
            printf 'Relay stopped: no saved progress, or the %s-round automatic limit was reached. Checkpoint is retained.\n' "${MAX_RELAY_ROUNDS}"
            exit 1
          fi
          request_file="$(mktemp "${RUNNER_TEMP}/stock-dispatch.XXXXXXXX.json")"
          export RELAY_REQUEST_FILE="${request_file}"
          /usr/bin/python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          request = {'ref': 'main', 'inputs': {
              'resume_run_id': os.environ['GITHUB_RUN_ID'],
              'resume_artifact_id': os.environ['ARTIFACT_ID'],
              'relay_chain': os.environ['RELAY_CHAIN'],
          }}
          Path(os.environ['RELAY_REQUEST_FILE']).write_text(json.dumps(request))
          PYTHON
          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/stock_rom.yml/dispatches" \
            --input "${request_file}"
          printf '\nNext round requested: chain %s, parent round %s, source run %s, Artifact %s.\n' \
            "${RELAY_CHAIN}" "${RELAY_ROUND}" "${GITHUB_RUN_ID}" "${ARTIFACT_ID}" >> "${GITHUB_STEP_SUMMARY}"

  extract:
    name: Extract completed official ROM and publish Release
    if: needs.download.outputs.state == 'complete'
    needs: [runner-image, download]
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    permissions:
      contents: write
    env:
      RESUME_RUN_ID: ${{ github.run_id }}
      RELAY_CHAIN: ${{ needs.download.outputs.chain }}
    steps:
      - name: Prepare isolated extraction directory
        run: |
          set -euo pipefail
          umask 077
          ROM_WORK="$(mktemp -d "${RUNNER_TEMP}/selene-extract.XXXXXXXX")"
          printf 'ROM_WORK=%s\nTMPDIR=%s\n' "${ROM_WORK}" "${ROM_WORK}" >> "${GITHUB_ENV}"
      - name: Checkout extractor
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Download this run's completed ROM archive
        uses: actions/download-artifact@main
        with:
          artifact-ids: ${{ needs.download.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ env.ROM_WORK }}/incoming
      - name: Restore only a completed ROM checkpoint
        run: /usr/bin/python3 scripts/stock_rom_relay.py restore-complete
      - name: List archive and extract all stock image payloads
        run: /usr/bin/python3 scripts/stock_rom.py "${ROM_WORK}/rom.tgz" "${ROM_WORK}/output"
      - name: Upload to a new draft and publish the complete Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="selene-stock-${ROM_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "${tag}" --target "${BUILDER_COMMIT}" \
            --draft --latest=false --title "selene stock ${ROM_VERSION} ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "${ROM_WORK}/output/release-notes.md" \
            "${ROM_WORK}/output/assets/"*
          gh release edit "${tag}" --draft=false --latest=false
          printf '[Download official stock payloads](https://github.com/%s/releases/tag/%s)\n\nStock ROM extraction only; not a device backup or proof of flash safety.\n' \
            "${GH_REPO}" "${tag}" >> "${GITHUB_STEP_SUMMARY}"
