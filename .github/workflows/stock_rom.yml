# Requirements: download the fixed official selene Fastboot ROM and publish payloads.
# Ambiguity: stock images are not device backups; real archive layout is not assumed.
# Research: GitHub Release asset limits and safe tarfile stream extraction.
# Optimization: 16 connections, live INFO events and five-second progress summaries.
# Risks: public firmware distribution, large download/disk usage and partial uploads.
# Validation: synthetic extraction tests; draft Release is published after uploads.
name: Selene Stock ROM Images

# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stock_rom.yml']
  pull_request:
    paths: ['.github/workflows/stock_rom.yml']
  workflow_dispatch:

run-name: Selene stock ROM - ${{ github.event_name }} - ${{ github.ref_name }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  ROM_URL: https://bigota.d.miui.com/V14.0.4.0.TKUCNXM/selene_images_V14.0.4.0.TKUCNXM_20231228.0000.00_13.0_cn_cfe62df805.tgz
  ROM_VERSION: V14.0.4.0.TKUCNXM
  GH_PROMPT_DISABLED: '1'

jobs:
  runner-image:
    name: Validate and resolve runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main
      - name: Checkout extractor
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Test extraction boundaries with synthetic inputs
        run: /usr/bin/python3 -m unittest discover -s tests -p test_stock_rom.py -v

  extract:
    name: Extract official selene stock images and publish Release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Checkout extractor
        uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Install job-scoped run_sudo
        uses: Grinch27/github-actions/.github/actions/run-sudo@main
      - name: Install aria2 binary package when needed
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          if ! command -v aria2c >/dev/null 2>&1; then
            run_sudo apt-get update
            run_sudo apt-get -y --no-install-recommends install aria2
          fi
      - name: Prepare isolated temporary directory and check download space
        run: |
          set -euo pipefail
          umask 077
          command -v aria2c
          command -v gh
          ROM_WORK="$(mktemp -d "${RUNNER_TEMP}/selene-stock.XXXXXXXX")"
          export ROM_WORK
          printf 'ROM_WORK=%s\nTMPDIR=%s\n' "${ROM_WORK}" "${ROM_WORK}" >> "${GITHUB_ENV}"
          /usr/bin/python3 - <<'PY'
          import os, shutil
          if shutil.disk_usage(os.environ['ROM_WORK']).free < 7 * 1024 ** 3:
              raise SystemExit('Insufficient download space; at least 7 GiB required')
          PY
      - name: Download official Fastboot archive with aria2 (16 connections)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          umask 077
          aria2_args=(
            --no-conf=true --no-netrc=true --enable-rpc=false
            --max-concurrent-downloads=1 --max-connection-per-server=16 --split=16
            --min-split-size=1M --continue=true --auto-save-interval=5
            --file-allocation=none --auto-file-renaming=false --allow-overwrite=false
            --connect-timeout=30 --timeout=60 --max-tries=3 --retry-wait=5
            --max-download-limit=0 --max-overall-download-limit=0
            --follow-torrent=false --follow-metalink=false
            --console-log-level=info --log-level=info
            --summary-interval=5 --show-console-readout=true
            --truncate-console-readout=false --human-readable=true
            --download-result=full --enable-color=false
            --log="${ROM_WORK}/aria2-download.log"
            --dir="${ROM_WORK}" --out=rom.tgz.partial
          )
          aria2_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'Download started (UTC): %s\nSource URL: %s\nOutput directory: %s\n' \
            "${aria2_started_at}" "${ROM_URL}" "${ROM_WORK}"
          printf 'Progress: completed/total (%%), CN=connections, DL=speed, ETA=time remaining.\n'
          printf 'Effective command: aria2c'
          printf ' %q' "${aria2_args[@]}" "${ROM_URL}"
          printf '\nDisk space before download:\n'
          df -h "${ROM_WORK}" || true
          aria2_started_seconds=${SECONDS}
          if aria2c "${aria2_args[@]}" "${ROM_URL}"; then
            aria2_exit_code=0
          else
            aria2_exit_code=$?
          fi
          aria2_elapsed_seconds=$((SECONDS - aria2_started_seconds))
          aria2_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          aria2_file_bytes=unknown
          if [[ -f "${ROM_WORK}/rom.tgz.partial" ]]; then
            aria2_file_bytes="$(stat -c %s "${ROM_WORK}/rom.tgz.partial" 2>/dev/null || printf unknown)"
          fi
          printf 'Download finished (UTC): %s\naria2 exit code: %s\nElapsed seconds: %s\nLocal apparent file bytes: %s\nEvent log: %s/aria2-download.log\n' \
            "${aria2_finished_at}" "${aria2_exit_code}" "${aria2_elapsed_seconds}" \
            "${aria2_file_bytes}" "${ROM_WORK}"
          printf 'Disk space after download:\n'
          df -h "${ROM_WORK}" || true
          {
            printf '### aria2 official ROM download\n\n| Field | Value |\n| --- | --- |\n'
            printf '| Source | %s |\n| Connections / splits | 16 / 16 |\n' "${ROM_URL}"
            printf '| Started UTC | %s |\n| Finished UTC | %s |\n' "${aria2_started_at}" "${aria2_finished_at}"
            printf '| aria2 exit code | %s |\n| Elapsed seconds | %s |\n| Local apparent file bytes | %s |\n' \
              "${aria2_exit_code}" "${aria2_elapsed_seconds}" "${aria2_file_bytes}"
            printf '\nProgress, speed, actual CN, ETA and INFO events are in the download step log.\n'
            printf 'On failure, apparent file length is not the completed byte count.\n'
          } >> "${GITHUB_STEP_SUMMARY}" || true
          if (( aria2_exit_code != 0 )); then
            exit "${aria2_exit_code}"
          fi
          mv "${ROM_WORK}/rom.tgz.partial" "${ROM_WORK}/rom.tgz"
      - name: List archive and extract all stock image payloads
        timeout-minutes: 35
        run: /usr/bin/python3 scripts/stock_rom.py "${ROM_WORK}/rom.tgz" "${ROM_WORK}/output"
      - name: Upload to a new draft and publish the complete Release
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="selene-stock-${ROM_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "${tag}" --target "${BUILDER_COMMIT}" \
            --draft --latest=false --title "selene stock ${ROM_VERSION} ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file "${ROM_WORK}/output/release-notes.md" \
            "${ROM_WORK}/output/assets/"*
          gh release edit "${tag}" --draft=false --latest=false
          printf '[Download official stock payloads](https://github.com/%s/releases/tag/%s)\n\nStock ROM extraction only; not a device backup or proof of flash safety.\n' \
            "${GH_REPO}" "${tag}" >> "${GITHUB_STEP_SUMMARY}"
