# Requirements: one selene target; private source access is an explicit setup step.
# Ambiguity: the locked source closure has not yet produced a clean CI boot image.
# Research: stop at the first failure and inspect it in a private environment.
# Optimization: one workflow, shared runner resolution, an Ubuntu build container.
# Risks: public repository; publish=false retains all source/logs/images on the runner.
# Validation: static tests on push/PR; manual full build; payload and AVB verification.
name: TWRP Selene (All in One Docker)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/twrp_allinone.yml', 'scripts/**', 'tests/**', 'source.lock.json']
  pull_request:
    paths: ['.github/workflows/twrp_allinone.yml', 'scripts/**', 'tests/**', 'source.lock.json']
  workflow_dispatch:
    inputs:
      publish:
        description: '允许公开 boot.img、静态报告及校验和，并创建预发布 Release'
        type: boolean
        default: false
        required: true

run-name: TWRP selene - ${{ github.event_name }} - ${{ github.ref_name }}
permissions: write-all
defaults:
  run:
    shell: bash
env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: 'true'
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  GIT_TERMINAL_PROMPT: '0'
  CONTAINER_IMAGE: ubuntu:22.04

concurrency:
  group: twrp-selene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-image:
    name: Validate and resolve runner-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve.outputs.RUNNER_IMAGE }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate scripts and boundary tests
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "${script}"; done
          /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate GitHub Actions syntax
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXXXX")"
          release=https://github.com/rhysd/actionlint/releases/download/v1.7.7
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "${release}/actionlint_1.7.7_linux_amd64.tar.gz" --output "${lint_dir}/actionlint_1.7.7_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "${release}/actionlint_1.7.7_checksums.txt" --output "${lint_dir}/checksums.txt"
          (cd "${lint_dir}" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "${lint_dir}/actionlint_1.7.7_linux_amd64.tar.gz" -C "${lint_dir}" actionlint
          "${lint_dir}/actionlint" -shellcheck='' .github/workflows/twrp_allinone.yml
      - name: Resolve runner-image
        id: resolve
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  build:
    name: selene - bootimage - Ubuntu 22.04 Docker
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout builder
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install job-scoped run_sudo
        uses: Grinch27/github-actions/.github/actions/run-sudo@main
      - name: Check private source access is configured
        env:
          TWRP_SOURCE_TOKEN: ${{ secrets.TWRP_SOURCE_TOKEN }}
        run: |
          if [[ -z "${TWRP_SOURCE_TOKEN}" ]]; then
            printf 'Configure TWRP_SOURCE_TOKEN with Contents: read for Grinch27/twrp_selene.\n' >&2
            exit 1
          fi
      - name: Prepare disposable runner disk
        run: bash scripts/prepare_runner.sh
      - name: Fetch reviewed private inputs
        env:
          TWRP_SOURCE_TOKEN: ${{ secrets.TWRP_SOURCE_TOKEN }}
        run: /usr/bin/python3 scripts/source_inputs.py fetch --output "${BUILD_ROOT}/inputs"
      - name: Build and validate in Docker
        id: compile
        run: |
          set -euo pipefail
          export BUILDER_UID="$(id -u)" BUILDER_GID="$(id -g)"
          sudo_command="$(command -v run_sudo)"
          docker pull "${CONTAINER_IMAGE}"
          if docker run --rm --init --cpus=4 --memory=14g --shm-size=2g \
            --security-opt=no-new-privileges \
            --env BUILDER_UID --env BUILDER_GID \
            --env DEBIAN_FRONTEND --env DEBCONF_NONINTERACTIVE_SEEN \
            --env APT_LISTCHANGES_FRONTEND --env NEEDRESTART_MODE \
            --env TZ --env LANG --env LC_ALL --env GIT_TERMINAL_PROMPT \
            --volume "${GITHUB_WORKSPACE}:/builder/self:ro" \
            --volume "${BUILD_ROOT}:/builder/work" \
            --volume "${sudo_command}:/usr/local/bin/run_sudo:ro" \
            --workdir /builder/work "${CONTAINER_IMAGE}" \
            bash /builder/self/scripts/container.sh \
            > "${BUILD_ROOT}/logs/container.log" 2>&1; then
            printf 'Build and static validation passed. Device functions are untested.\n'
          else
            result=$?
            printf 'Build failed (exit %s). Private compiler logs were retained only on the disposable runner.\n' "${result}" >&2
            if [[ -f "${BUILD_ROOT}/output/status.json" ]]; then
              cat "${BUILD_ROOT}/output/status.json"
            fi
            exit "${result}"
          fi
      - name: Upload explicitly approved public output
        if: inputs.publish && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twrp-selene-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BUILD_ROOT }}/output/boot.img
            ${{ env.BUILD_ROOT }}/output/static-validation.json
            ${{ env.BUILD_ROOT }}/output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish an explicitly approved prerelease
        if: inputs.publish && steps.compile.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILDER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="selene-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body="${BUILD_ROOT}/release.md"
          printf '%s\n' \
            'Experimental selene TWRP boot image, targeting China MIUI V14.0.4.0.TKUCNXM.' \
            'Build and static validation only. Boot, touch, FBE and backup/restore are NOT_TESTED.' \
            "Builder commit: ${BUILDER_COMMIT}" \
            'Source lock: source.lock.json at the builder commit.' > "${body}"
          gh release create "${tag}" --target "${BUILDER_COMMIT}" \
            --title "TWRP selene ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --prerelease --notes-file "${body}" \
            "${BUILD_ROOT}/output/boot.img" \
            "${BUILD_ROOT}/output/static-validation.json" \
            "${BUILD_ROOT}/output/SHA256SUMS"
      - name: Record validation boundary
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PUBLISH_OUTPUTS: ${{ inputs.publish }}
        run: |
          printf 'Build step: %s\n\nPublic outputs enabled: %s\n\nDevice boot/FBE/backup/restore: NOT_TESTED.\n' \
            "${COMPILE_OUTCOME}" "${PUBLISH_OUTPUTS}" >> "${GITHUB_STEP_SUMMARY}"
